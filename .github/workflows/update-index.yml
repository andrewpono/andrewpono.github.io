name: Update project index

on:
  schedule:
    # Runs once a day at 13:00 UTC. Adjust the cron expression to change
    # how often GitHub checks for new/removed repos.
    - cron: "0 13 * * *"
  workflow_dispatch: {}
  # Trigger this manually any time from the Actions tab ("Run workflow")
  # right after creating a new repo, instead of waiting for the next cron run.

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate index.html
        run: python3 scripts/generate_index.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update project index"
            git push
          fi
